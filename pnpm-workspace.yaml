packages:
    - apps/*
    - packages/*

allowBuilds:
    # The playground uses @cartesi/machine's WebAssembly entry point, which is
    # bundled in the package; its install script only matters to callers of the
    # native addon, and letting it run would mean an emulator installation and a
    # compiler wherever this workspace is installed — a deployment included.
    '@cartesi/machine': false
    es5-ext: true
    esbuild: true
    vue-demi: true

catalog:
    "@biomejs/biome": 2.5.10
    "@types/node": ^26
    "@types/react": ^19.2.17
    tsdown: ^0.22.14
    typescript: ^6.0.3
    viem: ^2.55.7

overrides:
    viem: "catalog:"

onlyBuiltDependencies:
    - bufferutil
    - esbuild
    - keccak
    - protobufjs
    - utf-8-validate

# changesets v3 is newer than pnpm's minimumReleaseAge window; drop these once
# the packages age out
minimumReleaseAgeExclude:
    - "@changesets/apply-release-plan@8.0.0"
    - "@changesets/assemble-release-plan@7.0.0"
    - "@changesets/changelog-git@1.0.0"
    - "@changesets/cli@3.0.0"
    - "@changesets/config@4.0.0"
    - "@changesets/errors@1.0.0"
    - "@changesets/get-dependents-graph@3.0.0"
    - "@changesets/git@4.0.0"
    - "@changesets/parse@1.0.0"
    - "@changesets/pre@3.0.0"
    - "@changesets/read@1.0.0"
    - "@changesets/should-skip-package@1.0.0"
    - "@changesets/types@7.0.0"
    - "@changesets/write@1.0.0"
    - '@cartesi/machine-darwin-arm64@1.0.0-alpha.1'
    - '@cartesi/machine-darwin-x64@1.0.0-alpha.1'
    - '@cartesi/machine-linux-arm64@1.0.0-alpha.1'
    - '@cartesi/machine-linux-x64@1.0.0-alpha.1'
    - '@cartesi/machine@1.0.0-alpha.1'
