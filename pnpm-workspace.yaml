packages:
    - apps/*
    - packages/*

allowBuilds:
    # The playground uses @cartesi/machine's WebAssembly entry point, which is
    # bundled in the package; its install script only matters to callers of the
    # native addon, and letting it run would mean an emulator installation and a
    # compiler wherever this workspace is installed — a deployment included.
    '@cartesi/machine': false
    es5-ext: true
    esbuild: true
    vue-demi: true

catalog:
    "@biomejs/biome": 2.5.12
    "@types/node": ^26.6.5
    "@types/react": ^19.3.0
    "@vitest/coverage-v8": ^5.0.5
    node-addon-api: ^8.9.2
    node-gyp: ^13.1.0
    node-gyp-build: ^4.8.4
    ox: ^1.8.10
    tsdown: ^0.23.2
    typescript: ^6.0.3
    viem: ^2.56.3
    vitest: ^5.0.5

overrides:
    viem: "catalog:"

onlyBuiltDependencies:
    - bufferutil
    - esbuild
    - keccak
    - protobufjs
    - utf-8-validate
