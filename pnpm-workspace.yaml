packages:
    - apps/*
    - packages/*

allowBuilds:
    es5-ext: true
    esbuild: true
    vue-demi: true

catalog:
    "@biomejs/biome": 2.5.9
    "@types/node": ^26
    "@types/react": ^19.2.17
    tsdown: ^0.22.14
    typescript: ^6.0.3
    viem: ^2.55.7

overrides:
    viem: "catalog:"

onlyBuiltDependencies:
    - bufferutil
    - esbuild
    - keccak
    - protobufjs
    - utf-8-validate
