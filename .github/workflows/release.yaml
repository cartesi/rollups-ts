name: release
on:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    actions: write
    contents: write
    id-token: write
    packages: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}

# emulator distribution @cartesi/machine's addon links against; must stay in
# the series the binding targets (CARTESI_MACHINE_SERIES in its install script)
env:
    CARTESI_MACHINE_VERSION: 0.21.0

jobs:
    # @cartesi/rollup is a native addon and must be published with prebuilds for
    # every supported platform. Building them is only worth it when the package
    # is actually about to be published, i.e. when its package.json version is
    # not yet on npm: false both on Version-PR runs (not bumped yet) and on
    # already-published versions. (Counting .changeset/*.md does not work: it
    # says nothing about which packages a bump would touch.)
    detect:
        name: detect native package publish
        runs-on: ubuntu-latest
        outputs:
            publish-rollup: ${{ steps.check-rollup.outputs.publish }}
            publish-machine: ${{ steps.check-machine.outputs.publish }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x

            - id: check-rollup
              run: |
                  LOCAL=$(node -p "require('./packages/rollup/package.json').version")
                  if npm view "@cartesi/rollup@${LOCAL}" version >/dev/null 2>&1; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "@cartesi/rollup@${LOCAL} already on npm -> skip prebuilds."
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "@cartesi/rollup@${LOCAL} not yet published -> build prebuilds."
                  fi

            - id: check-machine
              run: |
                  LOCAL=$(node -p "require('./packages/machine/package.json').version")
                  if npm view "@cartesi/machine@${LOCAL}" version >/dev/null 2>&1; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "@cartesi/machine@${LOCAL} already on npm -> skip platform packages."
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "@cartesi/machine@${LOCAL} not yet published -> build platform packages."
                  fi

    # @cartesi/rollup native prebuilds, built from the exact commit being
    # published. Each job uploads a prebuilds-<os> artifact the release job
    # collects into the package before it is packed.
    prebuild:
        name: prebuild ${{ matrix.os }}
        needs: detect
        if: needs.detect.outputs.publish-rollup == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest # linux-x64
                    - os: ubuntu-24.04-arm # linux-arm64
                    - os: macos-15-intel # darwin-x64
                    - os: macos-latest # darwin-arm64
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # the addon compiles libcmt from the machine-guest-tools
                  # submodule (packages/rollup/deps/machine-guest-tools)
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm i

            - name: Build prebuild
              run: pnpm --filter @cartesi/rollup prebuild:native

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: prebuilds-${{ matrix.os }}
                  if-no-files-found: error
                  path: packages/rollup/prebuilds/

    prebuild-riscv64:
        name: prebuild linux-riscv64 (cross)
        needs: detect
        if: needs.detect.outputs.publish-rollup == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm i

            # libcmt bundles the `cmio` ioctl ABI since machine-guest-tools
            # 0.18.0, so the Cartesi Linux headers are no longer needed here.
            - name: Install riscv64 cross toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

            - name: Cross-build libcmt (real IO driver)
              working-directory: packages/rollup
              run: make -C deps/machine-guest-tools/sys-utils/libcmt libcmt TOOLCHAIN_PREFIX=riscv64-linux-gnu-

            - name: Prebuild riscv64 addon
              env:
                  CC: riscv64-linux-gnu-gcc
                  CXX: riscv64-linux-gnu-g++
                  LIBCMT_LIB: ${{ github.workspace }}/packages/rollup/deps/machine-guest-tools/sys-utils/libcmt/build/riscv64/libcmt.a
              run: pnpm --filter @cartesi/rollup prebuild:native --strip-bin riscv64-linux-gnu-strip --platform linux --arch riscv64

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: prebuilds-riscv64
                  if-no-files-found: error
                  path: packages/rollup/prebuilds/

    # @cartesi/machine per-platform prebuilt packages
    # (@cartesi/machine-<platform>-<arch>), assembled from the exact commit
    # being published. Each job compiles the N-API addon against the installed
    # emulator's static libcartesi, bundles that installation's
    # cartesi-jsonrpc-machine server, and uploads the whole npm/ tree
    # (package-platform stamps every scaffold identically, so the artifacts
    # merge cleanly).
    machine-platform:
        name: machine platform package ${{ matrix.os }}
        needs: detect
        if: needs.detect.outputs.publish-machine == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest # linux-x64
                    - os: ubuntu-24.04-arm # linux-arm64
                    - os: macos-15-intel # darwin-x64
                    - os: macos-latest # darwin-arm64
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            # the emulator distribution the addon links against; its
            # cartesi-jsonrpc-machine server is bundled into the platform package
            - name: Install cartesi-machine emulator (linux)
              if: runner.os == 'Linux'
              run: |
                  wget -O /tmp/machine-emulator.deb "https://github.com/cartesi/machine-emulator/releases/download/v${CARTESI_MACHINE_VERSION}/machine-emulator_$(dpkg --print-architecture).deb"
                  sudo apt-get update && sudo apt-get install -y /tmp/machine-emulator.deb

            - name: Install cartesi-machine emulator (macos)
              if: runner.os == 'macOS'
              run: brew install cartesi/tap/cartesi-machine-emulator

            # the install script compiles the addon against the emulator above
            - name: Install Dependencies
              run: pnpm i

            - name: Assemble platform package
              run: pnpm --filter @cartesi/machine package:platform

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: machine-platform-${{ matrix.os }}
                  if-no-files-found: error
                  path: packages/machine/npm/

    # The WebAssembly flavor of @cartesi/machine. Unlike the addon there is
    # nothing per-platform about it — one module serves every target — so it is
    # a single job, and it travels inside the @cartesi/machine tarball rather
    # than in a package of its own. Without this the published package would
    # have no module at all and `init()` would fail for every browser consumer.
    machine-wasm:
        name: machine wasm module
        needs: detect
        if: needs.detect.outputs.publish-machine == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # `pnpm i` compiles @cartesi/rollup's addon against libcmt
                  # from the machine-guest-tools submodule
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            # no emulator distribution here, so @cartesi/machine's addon build
            # is skipped by the install script; the wasm build does not need it
            - name: Install Dependencies
              run: pnpm i

            # docker build of wasm/builder.Dockerfile, which pins both the
            # Emscripten toolchain and the emulator release
            - name: Build the emscripten module
              run: pnpm --filter @cartesi/machine build:wasm

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: machine-wasm
                  if-no-files-found: error
                  path: packages/machine/src/wasm/cartesi-machine.mjs

    release:
        name: release
        needs:
            [detect, prebuild, prebuild-riscv64, machine-platform, machine-wasm]
        # Run when creating the Version PR (publish=false, prebuilds skipped), or
        # when publishing AND every prebuild succeeded. Never publish a native
        # package without its binaries: a prebuild failure blocks the release
        # (re-runnable). The same holds for @cartesi/machine's WebAssembly
        # module, which ships inside its tarball.
        if: >-
            always() && needs.detect.result == 'success' &&
            (needs.detect.outputs.publish-rollup == 'false' ||
             (needs.prebuild.result == 'success' && needs.prebuild-riscv64.result == 'success')) &&
            (needs.detect.outputs.publish-machine == 'false' ||
             (needs.machine-platform.result == 'success' &&
              needs.machine-wasm.result == 'success'))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # @cartesi/rollup's native addon compiles libcmt from the
                  # machine-guest-tools submodule during `pnpm i`
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

            - name: Install Dependencies
              run: pnpm i

            # Collect all platform prebuilds into the package so
            # `changeset publish` packs @cartesi/rollup with them instead of
            # forcing consumers to compile from source. Only present when
            # publishing.
            - name: Collect prebuilds
              if: needs.detect.outputs.publish-rollup == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: prebuilds-*
                  merge-multiple: true
                  path: packages/rollup/prebuilds

            # Collect the assembled @cartesi/machine-<platform>-<arch> packages
            # so `pnpm release` can publish them right before @cartesi/machine
            # itself, which references them as optionalDependencies.
            - name: Collect machine platform packages
              if: needs.detect.outputs.publish-machine == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: machine-platform-*
                  merge-multiple: true
                  path: packages/machine/npm

            # Put the Emscripten module where `pnpm release`'s build expects
            # it: tsdown leaves the dynamic import in place and copy-wasm.mjs
            # copies the module next to whichever bundle holds it, so that
            # `files: ["dist/**"]` packs it with the rest of the package.
            - name: Collect machine wasm module
              if: needs.detect.outputs.publish-machine == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: machine-wasm
                  path: packages/machine/src/wasm

            - name: Create Release Pull Request or Publish to npm
              uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
              env:
                  # a build with no module to copy only warns, so that a
                  # checkout that never ran `build:wasm` still builds. A publish
                  # is the one case where that must be fatal instead.
                  CARTESI_REQUIRE_WASM: ${{ needs.detect.outputs.publish-machine }}
              with:
                  # This expects you to have a script called release which does a build for your packages and calls changeset publish
                  publish-script: pnpm release
